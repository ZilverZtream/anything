name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblmdb-dev libglfw3-dev libcurl4-openssl-dev \
            libcjson-dev libgit2-dev libleptonica-dev \
            libtesseract-dev libgumbo-dev libarchive-dev \
            libsqlite3-dev libzip-dev zstd libzstd-dev \
            libpst-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
